[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-adoption-research-agent"
version = "0.1.0"
description = "ADK multi-agent system that researches what drives and inhibits enterprise adoption of agentic AI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "google-adk>=2.11,<2.12",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pypdf>=5.0",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
adoption-agent = "adoption_agent.cli:main"

[tool.setuptools.packages.find]
include = ["adoption_agent*"]

[tool.setuptools.package-data]
adoption_agent = ["taxonomy.yaml", "report/templates/*.j2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
