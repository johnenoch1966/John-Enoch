name: Refresh report

# Runner mode is set in .github/refresh-runner:
#   google  -> the request is queued (status.json on research-data) and the
#              research runs INSIDE GOOGLE CLOUD (Cloud Run Job + Scheduler,
#              adoption_agent/refresh_service.py); research-data notifies requesters.
#   github  -> the research runs here on GitHub Actions (needs credentials below).
#
# One-click refresh for ANYONE with a free GitHub account:
#   the report's "Refresh research" button opens a pre-filled issue
#   ("[refresh] ..."); submitting it starts this workflow. Also runnable via
#   "Run workflow" (collaborators) and weekly on schedule.
#
# Guardrails (protect the owner's model budget):
#   - one refresh at a time, at most one start per 24 hours (tag `refresh-started`)
#   - issue text is never executed or passed to the agent (no injection surface)
# Publication:
#   - the new report must pass the automated quality gate (evals/gate_report.py:
#     schema, coverage, citation validity, conciseness) to auto-publish;
#     otherwise it is opened as a pull request for human review.
#
# One-time setup (Settings > Secrets and variables > Actions), ONE of:
#   A) secret GEMINI_API_KEY + variable GEMINI_AUTH=api_key
#   B) variables GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT (Vertex AI, keyless)
# and Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      research:
        description: "Research scope"
        type: choice
        options: [all, clusters, industries, none]
        default: all
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  pages: write
  id-token: write

env:
  COOLDOWN_HOURS: "24"
  REPORT_URL: https://johnenoch1966.github.io/John-Enoch/

jobs:
  admit:
    # Only issues created from the refresh form; ignore all other issues.
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[refresh]')
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.decide.outputs.allowed || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: mode
        run: echo "runner=$(cat .github/refresh-runner 2>/dev/null || echo github)" >> "$GITHUB_OUTPUT"
      - name: Queue for Google Cloud (google mode)
        if: steps.mode.outputs.runner == 'google'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "adoption-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          python3 .github/scripts/admit_refresh.py
      - id: decide
        if: steps.mode.outputs.runner != 'google'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CREDS: ${{ vars.GEMINI_AUTH == 'api_key' || vars.GCP_PROJECT_ID != '' }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          reason=""
          if [ "$HAS_CREDS" != "true" ]; then
            reason="Refresh isn't configured yet: the repository owner needs to add model credentials."
          fi
          if [ -z "$reason" ]; then
            busy=$(gh run list --workflow refresh-report.yml --json databaseId,status \
              --jq "[.[] | select(.databaseId != $RUN_ID and (.status == \"in_progress\" or .status == \"queued\"))] | length")
            [ "$busy" -gt 0 ] && reason="A refresh is already running. The page will update when it finishes."
          fi
          if [ -z "$reason" ]; then
            git fetch -q origin "refs/tags/refresh-started:refs/tags/refresh-started" 2>/dev/null || true
            last=$(git for-each-ref refs/tags/refresh-started --format='%(taggerdate:unix)')
            now=$(date +%s)
            if [ -n "$last" ] && [ $(( now - last )) -lt $(( COOLDOWN_HOURS * 3600 )) ]; then
              next=$(date -u -d "@$(( last + COOLDOWN_HOURS * 3600 ))" '+%Y-%m-%d %H:%M UTC')
              reason="The report was refreshed less than ${COOLDOWN_HOURS} hours ago. Next refresh possible after ${next}."
            fi
          fi
          if [ -n "$reason" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "### Refresh not started" >> "$GITHUB_STEP_SUMMARY"; echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body "Thanks! $reason Current report: $REPORT_URL"
              gh issue close "$ISSUE" --reason "not planned"
            fi
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body "Refresh started (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID). It takes about 3 hours; I'll comment here when it's done."
            fi
          fi

  refresh:
    needs: admit
    if: needs.admit.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: refresh-report
      cancel-in-progress: false
    outputs:
      gate: ${{ steps.gate.outcome }}
      pr_url: ${{ steps.pr.outputs.pull-request-url }}
    env:
      USE_VERTEX: ${{ vars.GCP_PROJECT_ID != '' && 'TRUE' || 'FALSE' }}
    steps:
      - uses: actions/checkout@v7
      - name: Mark refresh start (cooldown marker)
        run: |
          git config user.name "adoption-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git tag -fa refresh-started -m "refresh run ${{ github.run_id }}"
          git push -f origin refs/tags/refresh-started
      - name: Restore long-term memory
        uses: actions/checkout@v7
        with:
          ref: research-data
          path: _state
      - run: cp -r _state/data/. data/ && mkdir -p reports && cp -r _state/reports/. reports/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock -e .
      - name: Authenticate to Google Cloud (keyless WIF)
        if: env.USE_VERTEX == 'TRUE'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Run web research cycle
        env:
          GOOGLE_GENAI_USE_VERTEXAI: ${{ env.USE_VERTEX }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          ADOPTION_AGENT_TRACE_TO_CLOUD: ${{ env.USE_VERTEX == 'TRUE' && 'true' || 'false' }}
          ADOPTION_AGENT_MODEL: ${{ vars.ADOPTION_AGENT_MODEL || 'gemini-3.8-flash' }}
          ADOPTION_AGENT_REASONING_MODEL: ${{ vars.ADOPTION_AGENT_MODEL || 'gemini-3.8-flash' }}
        run: python -m adoption_agent.cli run --approval auto --research "${{ inputs.research || 'all' }}"
      - name: Automated publication quality gate
        id: gate
        continue-on-error: true
        run: python -m evals.gate_report
      - name: Upload run telemetry + privacy audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-telemetry-${{ github.run_id }}
          path: runs/
      - name: Stage results
        if: always()
        run: |
          rsync -a --delete --exclude README.md --exclude draft_report.json data/ _state/data/
          rsync -a --delete --exclude draft.html reports/ _state/reports/
      - name: Publish (gate passed)
        if: steps.gate.outcome == 'success'
        working-directory: _state
        run: |
          git config user.name "adoption-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data reports
          git diff --cached --quiet || git commit -m "chore(report): refresh ${{ github.run_id }} (quality gate passed)"
          git push origin HEAD:research-data
      - name: Open pull request for human review (gate failed)
        id: pr
        if: always() && steps.gate.outcome != 'success'
        uses: peter-evans/create-pull-request@v8
        with:
          path: _state
          base: research-data
          branch: refresh/${{ github.run_id }}
          title: "Research refresh ${{ github.run_id }}: quality gate failed, review needed"
          commit-message: "chore(report): research refresh (needs review)"
          body: |
            The automated quality gate did not pass for this refresh (see the run summary).
            Review `reports/index.html`; **merging publishes the report**.

  deploy:
    needs: refresh
    if: needs.refresh.outputs.gate == 'success'
    uses: ./.github/workflows/pages.yml

  report-back:
    needs: [admit, refresh, deploy]
    if: always() && needs.admit.outputs.allowed == 'true' && github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          REFRESH: ${{ needs.refresh.result }}
          GATE: ${{ needs.refresh.outputs.gate }}
          DEPLOY: ${{ needs.deploy.result }}
          PR_URL: ${{ needs.refresh.outputs.pr_url }}
        run: |
          if [ "$DEPLOY" = "success" ]; then
            msg="Done! The refreshed report passed the quality checks and is live: $REPORT_URL"
          elif [ "$REFRESH" = "success" ] && [ "$GATE" != "success" ]; then
            msg="The refresh finished but didn't pass the automated quality checks, so the owner will review it first: $PR_URL"
          else
            msg="Sorry, the refresh didn't complete. The owner has been notified via the failed run. Current report: $REPORT_URL"
          fi
          gh issue comment "$ISSUE" --body "$msg"
          gh issue close "$ISSUE"
