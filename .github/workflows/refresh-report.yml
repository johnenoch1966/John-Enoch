name: Refresh report

# Re-runs the research cycle on a schedule so the report stays current.
# Evidence accumulates in data/evidence.db; the updated report is committed
# back to the repo and published to GitHub Pages by pages.yml.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   GCP_PROJECT_ID           - project with Vertex AI enabled
#   GCP_WIF_PROVIDER         - Workload Identity Federation provider resource name
#   GCP_SERVICE_ACCOUNT      - service account with roles/aiplatform.user

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      refresh_scope:
        description: "Rebuild the top-50 use-case list"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: refresh-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Run research cycle
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          ADOPTION_AGENT_TRACE_TO_CLOUD: "true"
        run: |
          python -m adoption_agent.cli run ${{ inputs.refresh_scope && '--refresh-scope' || '' }}
      - name: Upload run telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-telemetry-${{ github.run_id }}
          path: runs/
      - name: Commit updated report
        run: |
          git config user.name "adoption-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "chore(report): automated refresh $(date -u +%Y-%m-%d)"
          git push
