name: Refresh report

# Re-runs the research cycle on a schedule so the report stays current.
# Evidence accumulates in data/evidence.db; the updated report is committed
# back to the repo and published to GitHub Pages by pages.yml.
#
# Skipped until the repository VARIABLES below are set (from `terraform output`):
#   GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT
# (In production the Cloud Run Job + Cloud Scheduler defined in Terraform do
# the same job inside Google Cloud.)

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      research:
        description: "Research scope"
        type: choice
        options: [all, clusters, industries, none]
        default: all

permissions:
  contents: write
  id-token: write

concurrency:
  group: refresh-report
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock .
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Run research cycle
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          ADOPTION_AGENT_TRACE_TO_CLOUD: "true"
        run: python -m adoption_agent.cli run --research "${{ inputs.research || 'all' }}"
      - name: Upload run telemetry + privacy audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-telemetry-${{ github.run_id }}
          path: runs/
      - name: Commit updated report
        run: |
          git config user.name "adoption-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "chore(report): automated refresh $(date -u +%Y-%m-%d)"
          git push
