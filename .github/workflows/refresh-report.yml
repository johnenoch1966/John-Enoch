name: Refresh report

# Started by the report's "Refresh research" button (workflow_dispatch; only
# repo collaborators can run it) or on schedule. HUMAN-IN-THE-LOOP release:
#   1. restore long-term memory from the `research-data` branch
#   2. run the web research cycle (unattended, approval policy "auto")
#   3. open a pull request against `research-data` with the new report
#   4. a human reviews and merges -> GitHub Pages deploys (pages.yml)
#
# Model credentials (configure ONE in Settings > Secrets and variables > Actions):
#   A) Gemini API key:   secret GEMINI_API_KEY  + variable GEMINI_AUTH=api_key
#   B) Vertex AI (keyless WIF, from `terraform output`):
#                        variables GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT
# Also enable: Settings > Actions > General > "Allow GitHub Actions to create
# and approve pull requests".

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      research:
        description: "Research scope"
        type: choice
        options: [all, clusters, industries, none]
        default: all

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: refresh-report
  cancel-in-progress: false

jobs:
  not-configured:
    if: vars.GCP_PROJECT_ID == '' && vars.GEMINI_AUTH != 'api_key'
    runs-on: ubuntu-latest
    steps:
      - name: Explain setup
        run: |
          {
            echo "## Refresh not configured yet"
            echo "Add model credentials, then click **Run workflow** again:"
            echo "- **Gemini API key:** secret \`GEMINI_API_KEY\` and variable \`GEMINI_AUTH=api_key\`, or"
            echo "- **Vertex AI:** variables \`GCP_PROJECT_ID\`, \`GCP_WIF_PROVIDER\`, \`GCP_SERVICE_ACCOUNT\` (see deployment/README.md)."
            echo "Also enable *Settings > Actions > General > Allow GitHub Actions to create and approve pull requests*."
          } >> "$GITHUB_STEP_SUMMARY"

  refresh:
    if: vars.GCP_PROJECT_ID != '' || vars.GEMINI_AUTH == 'api_key'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      USE_VERTEX: ${{ vars.GCP_PROJECT_ID != '' && 'TRUE' || 'FALSE' }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore long-term memory
        uses: actions/checkout@v4
        with:
          ref: research-data
          path: _state
      - run: cp -r _state/data/. data/ && mkdir -p reports && cp -r _state/reports/. reports/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock .
      - name: Authenticate to Google Cloud (keyless WIF)
        if: env.USE_VERTEX == 'TRUE'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Run web research cycle
        env:
          GOOGLE_GENAI_USE_VERTEXAI: ${{ env.USE_VERTEX }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          ADOPTION_AGENT_TRACE_TO_CLOUD: ${{ env.USE_VERTEX == 'TRUE' && 'true' || 'false' }}
          ADOPTION_AGENT_MODEL: ${{ vars.ADOPTION_AGENT_MODEL || 'gemini-3.8-flash' }}
          ADOPTION_AGENT_REASONING_MODEL: ${{ vars.ADOPTION_AGENT_MODEL || 'gemini-3.8-flash' }}
        run: python -m adoption_agent.cli run --approval auto --research "${{ inputs.research || 'all' }}"
      - name: Upload run telemetry + privacy audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-telemetry-${{ github.run_id }}
          path: runs/
      - name: Stage results for review
        if: always()
        run: |
          rsync -a --delete --exclude README.md --exclude draft_report.json data/ _state/data/
          rsync -a --delete --exclude draft.html reports/ _state/reports/
      - name: Open pull request for human approval
        if: always()
        uses: peter-evans/create-pull-request@v7
        with:
          path: _state
          base: research-data
          branch: refresh/${{ github.run_id }}
          title: "Research refresh ${{ github.run_id }}: review before publishing"
          commit-message: "chore(report): automated research refresh"
          body: |
            Web research cycle started from the report's **Refresh research** button (or schedule).
            **Merging publishes the report to GitHub Pages.** Review `reports/index.html` and the
            run telemetry / privacy audit artifact before approving.
