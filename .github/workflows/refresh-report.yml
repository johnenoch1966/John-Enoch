name: Refresh report

# Scheduled research cycle with a HUMAN-IN-THE-LOOP release:
#   1. restore long-term memory from the `research-data` branch
#   2. run the agent (unattended, approval policy "auto")
#   3. open a pull request against `research-data` with the new report
#   4. a human reviews and merges -> GitHub Pages deploys (pages.yml)
#
# Skipped until the repository VARIABLES below are set (from `terraform output`):
#   GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      research:
        description: "Research scope"
        type: choice
        options: [all, clusters, industries, none]
        default: all

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: refresh-report
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Restore long-term memory
        uses: actions/checkout@v7
        with:
          ref: research-data
          path: _state
      - run: cp -r _state/data/. data/ && mkdir -p reports && cp -r _state/reports/. reports/
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock .
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Run research cycle
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          ADOPTION_AGENT_TRACE_TO_CLOUD: "true"
        run: python -m adoption_agent.cli run --approval auto --research "${{ inputs.research || 'all' }}"
      - name: Upload run telemetry + privacy audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-telemetry-${{ github.run_id }}
          path: runs/
      - name: Stage results for review
        run: |
          rsync -a --delete --exclude README.md data/ _state/data/
          rsync -a --delete reports/ _state/reports/
      - name: Open pull request for human approval
        uses: peter-evans/create-pull-request@v8
        with:
          path: _state
          base: research-data
          branch: refresh/${{ github.run_id }}
          title: "Research refresh ${{ github.run_id }}: review before publishing"
          commit-message: "chore(report): automated research refresh"
          body: |
            Automated research cycle. **Merging publishes the report to GitHub Pages.**
            Review `reports/index.html` (download the artifact or check out the branch)
            and the run telemetry / privacy audit artifact before approving.
