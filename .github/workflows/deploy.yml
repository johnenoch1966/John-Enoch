name: Deploy to Cloud Run Job

# Manual deployment of the containerised agent as a Cloud Run Job, which can
# then be triggered on demand or by Cloud Scheduler.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  JOB: adoption-research-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy
        run: |
          gcloud run jobs deploy "$JOB" \
            --source . \
            --region "$REGION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --service-account "${{ secrets.GCP_SERVICE_ACCOUNT }}" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},ADOPTION_AGENT_TRACE_TO_CLOUD=true" \
            --task-timeout 3600 \
            --max-retries 1
