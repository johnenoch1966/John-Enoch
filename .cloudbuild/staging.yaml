# Cloud Build: continuous delivery to STAGING.
# Trigger: push to main. Build -> scan -> push -> deploy Cloud Run Job -> smoke test.
substitutions:
  _REGION: us-central1
  _ENV: staging
  _REPO: adoption-agent-staging
  _JOB: adoption-agent-staging

steps:
  - id: unit-tests
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements.lock -e '.[dev]' && python -m pytest -q"]
    env: ["GOOGLE_GENAI_USE_VERTEXAI=TRUE", "GOOGLE_CLOUD_PROJECT=ci"]

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --label=org.opencontainers.image.revision=$SHORT_SHA
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent:$SHORT_SHA
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent:${_ENV}
      - .
    waitFor: ["unit-tests"]

  - id: container-smoke-test
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - -e=GOOGLE_CLOUD_PROJECT=ci
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent:$SHORT_SHA
      - python
      - -c
      - "from adoption_agent.agent import app; print(app.name, 'ok')"

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent"]

  - id: deploy-staging
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_JOB}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent:$SHORT_SHA

  - id: post-deploy-check
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        image=$(gcloud run jobs describe ${_JOB} --region=${_REGION} --format='value(template.template.containers[0].image)')
        echo "Deployed image: $image"
        [[ "$image" == *":$SHORT_SHA" ]] || { echo "Image mismatch"; exit 1; }

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/agent:$SHORT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
