# Cloud Build: PR checks (lint, security scan, tests + coverage gate, Terraform).
# Trigger: pull requests to main. Steps share a virtualenv in /workspace.
steps:
  - id: install
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - python -m venv /workspace/.venv && /workspace/.venv/bin/pip install -q -r requirements.lock -e '.[dev]' bandit

  - id: lint
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "/workspace/.venv/bin/ruff check adoption_agent tests && /workspace/.venv/bin/ruff format --check adoption_agent tests"]
    waitFor: ["install"]

  - id: security-scan
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "/workspace/.venv/bin/bandit -q -ll -r adoption_agent"]
    waitFor: ["install"]

  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "/workspace/.venv/bin/pytest -q --cov=adoption_agent --cov-fail-under=80"]
    env: ["GOOGLE_GENAI_USE_VERTEXAI=TRUE", "GOOGLE_CLOUD_PROJECT=ci"]
    waitFor: ["install"]

  - id: terraform-validate
    name: hashicorp/terraform:1.9
    entrypoint: sh
    args: ["-c", "cd deployment/terraform && terraform fmt -check -recursive && terraform init -backend=false -input=false && terraform validate"]
    waitFor: ["-"]

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
